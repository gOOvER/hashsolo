services:
  bitcoin-testnet:
    container_name: bitcoin-testnet
    build:
      context: ./docker/bitcoin
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - bitcoin-testnet
    ports:
      - "127.0.0.1:18332:18332/tcp"
      - "0.0.0.0:18333:18333/tcp"
    command: >
      -printtoconsole
      -datadir=/app/data
      -testnet
    volumes:
      - "./data/testnet/bitcoin:/app/data"
      - "./bitcoin-testnet.conf:/app/data/bitcoin.conf:ro"

  public-pool-testnet:
    container_name: public-pool-testnet
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      bitcoin-testnet:
        condition: service_started
    networks:
      - bitcoin-testnet
    ports:
      - "0.0.0.0:13333:13333/tcp"
      - "127.0.0.1:13334:13334/tcp"
    volumes:
      - "./data/testnet/public-pool:/hashsolo/DB"
      - "./public-pool-testnet.env:/hashsolo/.env:ro"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.API_PORT||13334)+'/api/info').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  bitcoin-testnet:
