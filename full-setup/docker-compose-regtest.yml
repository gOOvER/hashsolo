services:
  bitcoin-regtest:
    container_name: bitcoin-regtest
    build:
      context: ./docker/bitcoin
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - bitcoin-regtest
    ports:
      - "127.0.0.1:28332:28332/tcp"
      - "0.0.0.0:28333:28333/tcp"
    command: >
      -printtoconsole
      -datadir=/app/data
      -regtest
      -blockversion=536870912
    volumes:
      - "./data/regtest/bitcoin:/app/data"
      - "./bitcoin-regtest.conf:/app/data/bitcoin.conf:ro"

  public-pool-regtest:
    container_name: public-pool-regtest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      bitcoin-regtest:
        condition: service_started
    networks:
      - bitcoin-regtest
    ports:
      - "0.0.0.0:23333:23333/tcp"
      - "127.0.0.1:23334:23334/tcp"
    volumes:
      - "./data/regtest/public-pool:/hashsolo/DB"
      - "./public-pool-regtest.env:/hashsolo/.env:ro"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.API_PORT||23334)+'/api/info').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  bitcoin-regtest:
